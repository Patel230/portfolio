        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0d0d0d;
        z-index: 9999;
        transition: opacity 0.3s ease, visibility 0.3s ease;
      }
      .loading-screen.hidden { 
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .loading-screen div { animation: none; border-top-color: #fbbf24; }
      }
